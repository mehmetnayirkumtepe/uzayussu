name: Derle (exe, dmg, AppImage, apk)
on:
  workflow_dispatch:
jobs:
  masaustu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: masaustu-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: APK olustur
        run: |
          mkdir mobil && cd mobil
          mkdir www && cp ../index.html ../manifest.json ../sw.js ../icon.svg ../icon.png www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Uzay Üssü Komutanı" tr.okul.uzayussu --web-dir=www
          npx cap add android
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/;s/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobil/android/app/build/outputs/apk/debug/*.apk
